<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おうちダッシュボード">
<title>おうちダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #fbf4e6;
    --paper-2: #fffaf0;
    --ink: #5b4636;
    --ink-dim: #9c8a72;
    --line: #e3d6bd;
    --accent-gomi: #6fa84f;
    --accent-cal: #4fa3c9;
    --accent-weather: #e8a33d;
    --accent-memo: #e0735c;
    --accent-alert: #d64545;
    --tape-1: #cfe3c4;
    --tape-2: #f6c9d0;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      repeating-linear-gradient(3deg, rgba(70,42,16,0.12) 0px, rgba(70,42,16,0.12) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(3deg, rgba(120,80,40,0.10) 0px, rgba(120,80,40,0.10) 2px, transparent 2px, transparent 11px),
      repeating-linear-gradient(3deg, rgba(160,112,64,0.10) 0px, rgba(160,112,64,0.10) 6px, transparent 6px, transparent 38px),
      repeating-linear-gradient(3deg, rgba(90,58,26,0.08) 0px, rgba(90,58,26,0.08) 14px, transparent 14px, transparent 90px),
      linear-gradient(170deg, #ddbd8d 0%, #cda06d 45%, #b98a52 100%);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
  }
  .mincho{ font-family: 'Yomogi', cursive; font-weight: 400; }

  #app{
    display:grid;
    grid-template-rows: auto 1fr;
    height:100vh;
    width:100vw;
    padding: 24px;
    gap: 18px;
  }

  /* ---- header ---- */
  header{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
  }
  #season-icon{ font-size: clamp(40px, 6vw, 64px); line-height:1; grid-column:1; }
  #date-block{ grid-column:2; text-align:center; }
  #date-block .youbi{
    font-size: clamp(28px, 3.4vw, 40px);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.15em;
  }
  #date-block .date{
    font-size: clamp(46px, 7vw, 72px);
    font-weight: 700;
    text-shadow: 1px 1px 0 rgba(91,70,54,0.15);
  }

  /* ---- panel base ---- */
  .panel{
    position: relative;
    background: var(--paper);
    border-radius: 14px;
    padding: 20px 24px;
    box-shadow: 0 4px 12px rgba(91,70,54,0.18);
  }
  .panel::before{
    content:"";
    position:absolute;
    top:-9px; left:50%;
    width:64px; height:20px;
    background: var(--tape-color, var(--tape-1));
    opacity:0.85;
    transform: translateX(-50%) rotate(-3deg);
    border-radius: 2px;
  }
  .panel h2{
    margin:0 0 12px 0;
    font-size: 22px;
    font-weight: 700;
    font-family: 'Yomogi', cursive;
    color: var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .h2-icon{ font-size: 1.4em; line-height:1; }

  /* ---- main layout ---- */
  #main{
    display:grid;
    grid-template-columns: 2.1fr 1fr;
    grid-template-rows: minmax(0,1.05fr) minmax(0,1fr);
    gap: 18px;
    min-height:0;
  }
  #hero-row{
    grid-column: 1;
    grid-row: 1;
    display:flex;
    gap: 18px;
    min-height:0;
  }
  #strip-row{
    grid-column: 1;
    grid-row: 2;
    display:flex;
    gap: 14px;
    min-height:0;
  }
  #memo-panel{
    grid-column: 2;
    grid-row: 1 / span 2;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #memo-panel::before{ --tape-color: #f6dfa6; }

  /* ---- clock card ---- */
  #clock-card{
    flex: 0 0 40%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #clock-card::before{ --tape-color: var(--tape-1); }
  .clock-face{
    position: relative;
    width: min(100%, 260px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background: var(--paper-2);
    border: 7px solid var(--paper);
    box-shadow: 0 6px 16px rgba(91,70,54,0.28), inset 0 0 0 1px var(--line);
    margin: 0 auto;
  }
  .tick-wrap{ position:absolute; inset:0; }
  .tick-mark{
    position:absolute;
    top:8px; left:50%;
    width:3px; height:12px;
    background: var(--ink-dim);
    border-radius:2px;
    transform: translateX(-50%);
  }
  .tick-mark.major{ width:5px; height:18px; background: var(--ink); top:6px; }
  .hand{
    position:absolute;
    left:50%; bottom:50%;
    transform-origin: 50% 100%;
    border-radius:6px;
  }
  .hand-hour{ width:7px; height:26%; background: var(--ink); margin-left:-3.5px; }
  .hand-minute{ width:5px; height:37%; background: var(--ink); margin-left:-2.5px; }
  .hand-second{ width:2px; height:41%; background: var(--accent-memo); margin-left:-1px; }
  .clock-center-dot{
    position:absolute; top:50%; left:50%;
    width:14px; height:14px;
    background: var(--ink);
    border-radius:50%;
    transform: translate(-50%,-50%);
    z-index:2;
  }
  .digital-badge{
    position:absolute;
    top:70%; left:50%;
    transform: translate(-50%,-50%);
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 6px 14px;
    font-family: 'SF Mono','Menlo','Consolas',monospace;
    font-size: 24px;
    font-weight:700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18);
    z-index:3;
  }

  /* ---- today card (weather + schedule + gomi) ---- */
  #today-card{
    flex: 1;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  #today-card::before{ --tape-color: var(--tape-2); }
  .today-weather{
    display:flex;
    align-items:center;
    gap:16px;
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px dashed var(--line);
  }
  #today-weather-icon{ font-size: 52px; line-height:1; }
  #today-temp{
    font-size: 42px;
    font-weight:700;
    font-family:'SF Mono','Menlo','Consolas',monospace;
    font-variant-numeric: tabular-nums;
    color: var(--accent-weather);
  }
  #today-wdesc{ font-size: 18px; color: var(--ink-dim); }
  #hourly-trend{
    display:flex;
    justify-content:space-between;
    gap:6px;
    margin-top: 10px;
    padding-top: 8px;
  }
  .hourly-item{ text-align:center; flex:1; }
  .hourly-item .hh{ font-size:13px; color:var(--ink-dim); }
  .hourly-item .ht{ font-size:16px; font-weight:700; color:var(--accent-weather); font-variant-numeric: tabular-nums; }
  #today-gomi-line{
    font-size: 22px;
    font-weight: 700;
    color: var(--accent-gomi);
    margin-top: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--line);
  }
  #today-events-list{ flex:1; overflow-y:auto; min-height:0; }
  .cal-event{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 9px 0;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.4;
  }
  .cal-event .bullet{ width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .cal-event .time{ flex:0 0 auto; min-width:96px; color:var(--ink-dim); font-variant-numeric: tabular-nums; }
  .cal-event .title{ flex:1; }
  .cal-empty{ color: var(--ink-dim); font-size: 19px; padding: 4px 0; }
  .cal-error{ color: var(--accent-alert); font-size: 16px; }

  /* ---- 5-day strip ---- */
  .strip-day{
    flex:1;
    min-width:0;
    background: var(--paper);
    border-radius: 12px;
    padding: 14px 10px;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow: 0 3px 8px rgba(91,70,54,0.15);
  }
  .strip-daylabel{ font-weight:700; color: var(--accent-cal); font-size:19px; text-align:center; }
  .strip-weather{ text-align:center; font-size:18px; color:var(--ink-dim); }
  .strip-weather .icon{ font-size:32px; display:block; }
  .strip-weather .fc-max{ color: var(--accent-memo); font-weight:700; }
  .strip-weather .fc-min{ color: var(--accent-cal); }
  .strip-gomi{
    font-size:18px;
    text-align:center;
    color: var(--accent-gomi);
    font-weight:700;
    line-height:1.3;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--line);
  }
  .strip-gomi .icon{ font-size:26px; display:block; }
  .strip-events{ font-size:17px; font-weight:700; color: var(--ink-dim); line-height:1.5; overflow:hidden; flex:1; text-align:left; }

  /* ---- memo ---- */
  #memo-status{ font-size:12px; color: var(--ink-dim); margin-left:auto; font-family:'Zen Kaku Gothic New', sans-serif; }
  #memo-text{
    flex:1;
    resize:none;
    background: var(--paper-2);
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 20px;
    line-height: 1.9;
    padding: 14px;
    outline:none;
    background-image: repeating-linear-gradient(transparent, transparent 37px, var(--line) 38px);
  }

  /* ---- Bing photo ---- */
  #daily-photo-frame{
    position: fixed;
    right: 16px;
    bottom: 16px;
    background: var(--paper);
    padding: 8px 8px 22px 8px;
    border-radius: 4px;
    box-shadow: 0 8px 20px rgba(91,70,54,0.35);
    transform: rotate(-6deg);
    z-index: 5;
    pointer-events: none;
  }
  #daily-photo{ width: 150px; height: 150px; object-fit: cover; display:block; border-radius: 2px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div id="season-icon">🍁</div>
    <div id="date-block">
      <div class="youbi" id="youbi">-曜日</div>
      <div class="date mincho" id="date">----年--月--日</div>
    </div>
    <div></div>
  </header>

  <div id="main">
    <div id="hero-row">
      <div class="panel" id="clock-card">
        <div class="clock-face" id="clock-face">
          <div class="hand hand-hour" id="hand-hour"></div>
          <div class="hand hand-minute" id="hand-minute"></div>
          <div class="hand hand-second" id="hand-second"></div>
          <div class="clock-center-dot"></div>
          <div class="digital-badge" id="digital-badge">--:--:--</div>
        </div>
      </div>

      <div class="panel" id="today-card">
        <h2><span class="h2-icon">🗓️</span> 今日の予定</h2>
        <div id="today-events-list"></div>
        <div class="today-weather">
          <span id="today-weather-icon">🌤️</span>
          <span id="today-temp">--℃</span>
          <span id="today-wdesc">読み込み中...</span>
        </div>
        <div id="hourly-trend"></div>
        <div id="today-gomi-line"></div>
      </div>
    </div>

    <div id="strip-row"></div>

    <div class="panel" id="memo-panel">
      <h2><span class="h2-icon">✏️</span> メモ・タスク<span id="memo-status"></span></h2>
      <textarea id="memo-text" placeholder="ここにメモやタスクを書いてください。スマホからも編集できます。"></textarea>
    </div>
  </div>
</div>

<div id="daily-photo-frame">
  <img id="daily-photo" src="https://bz.w3h5.com/img/hd" alt="今日の写真" onerror="this.parentNode.style.display='none'">
</div>

<script>
/* =========================================================
   設定エリア
   ========================================================= */
const WEATHER_LAT = 34.80;
const WEATHER_LON = 135.36;

const JSONBIN_ID = "6aa38fe2ffd5d16053f8eff0";
const JSONBIN_KEY = "$2a$10$0nLHD2dP8QyBOdKlEc3XKecWxzvdIUZaQ8Gt8dWDRBRhKV3jemRVy";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

const CALENDAR_ID = "bellyrie@gmail.com";
const GOOGLE_API_KEY = "AIzaSyCnFw7dx-Dm8q6E5_Dudp7jssSLhGbIyiQ";

const GOMI_WED_REF = new Date(2026, 3, 1);
const GOMI_FRI_REF = new Date(2026, 3, 3);

/* ========================================================= */

const youbiList = ["日","月","火","水","木","金","土"];
function pad(n){ return String(n).padStart(2,"0"); }
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weeksBetween(a,b){ return Math.floor((startOfDay(a)-startOfDay(b))/(7*86400000)); }

// ---- 日付・季節 ----
function updateDate(){
  const now = new Date();
  document.getElementById("date").textContent =
    now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
  document.getElementById("youbi").textContent = youbiList[now.getDay()] + "曜日";
}
function updateSeasonIcon(){
  const month = new Date().getMonth() + 1;
  let icon = "🍁";
  if([3,4,5].includes(month)) icon = "🌸";
  else if([6,7,8].includes(month)) icon = "🌻";
  else if([9,10,11].includes(month)) icon = "🍁";
  else icon = "⛄";
  document.getElementById("season-icon").textContent = icon;
}
updateDate();
updateSeasonIcon();
setInterval(() => { updateDate(); updateSeasonIcon(); }, 60*1000);

// ---- アナログ+デジタル時計 ----
function buildClockFace(){
  const face = document.getElementById("clock-face");
  for(let i=0;i<12;i++){
    const wrap = document.createElement("div");
    wrap.className = "tick-wrap";
    wrap.style.transform = "rotate(" + (i*30) + "deg)";
    const mark = document.createElement("div");
    mark.className = "tick-mark" + (i % 3 === 0 ? " major" : "");
    wrap.appendChild(mark);
    face.appendChild(wrap);
  }
}
buildClockFace();

function updateClock(){
  const now = new Date();
  const h = now.getHours() % 12;
  const m = now.getMinutes();
  const s = now.getSeconds();
  const hourDeg = h*30 + m*0.5;
  const minDeg = m*6 + s*0.1;
  const secDeg = s*6;
  document.getElementById("hand-hour").style.transform = "rotate(" + hourDeg + "deg)";
  document.getElementById("hand-minute").style.transform = "rotate(" + minDeg + "deg)";
  document.getElementById("hand-second").style.transform = "rotate(" + secDeg + "deg)";
  document.getElementById("digital-badge").textContent =
    pad(now.getHours()) + ":" + pad(m) + ":" + pad(s);
}
setInterval(updateClock, 1000);
updateClock();

// ---- ごみの日(計算ロジック) ----
const gomiIconMap = {
  "燃やすごみ": "🔥",
  "プラスチック類": "♻️",
  "ペットボトル": "🥤",
  "かん・びん": "🍾",
  "紙・布": "📄",
  "小型不燃ごみ": "🔧"
};
function gomiForDate(date){
  const wd = date.getDay();
  if(wd===1) return "燃やすごみ";
  if(wd===2) return "プラスチック類";
  if(wd===4) return "燃やすごみ";
  if(wd===3){
    const w = ((weeksBetween(date, GOMI_WED_REF) % 2) + 2) % 2;
    return w===0 ? "ペットボトル" : "かん・びん";
  }
  if(wd===5){
    const w = ((weeksBetween(date, GOMI_FRI_REF) % 2) + 2) % 2;
    return w===0 ? "紙・布" : "小型不燃ごみ";
  }
  return null;
}
function updateTodayGomi(){
  const t = gomiForDate(new Date());
  const el = document.getElementById("today-gomi-line");
  el.textContent = t ? ((gomiIconMap[t] || "🗑") + " " + t) : "ごみ収集無し";
}
updateTodayGomi();
setInterval(updateTodayGomi, 60*60*1000);

// ---- 天気(Open-Meteo) ----
const weatherCodeMap = {
  0:["快晴","☀️"],1:["晴れ","🌤️"],2:["晴れ時々曇り","⛅"],3:["曇り","☁️"],
  45:["霧","🌫️"],48:["霧","🌫️"],
  51:["小雨","🌦️"],53:["小雨","🌦️"],55:["雨","🌧️"],
  61:["雨","🌧️"],63:["雨","🌧️"],65:["大雨","🌧️"],
  71:["雪","🌨️"],73:["雪","🌨️"],75:["大雪","❄️"],
  80:["にわか雨","🌦️"],81:["にわか雨","🌦️"],82:["激しい雨","⛈️"],
  95:["雷雨","⛈️"],96:["雷雨","⛈️"],99:["雷雨","⛈️"]
};
let latestDaily = null;

function renderHourlyTrend(hourly){
  const el = document.getElementById("hourly-trend");
  if(!el || !hourly) return;
  const now = new Date();
  const todayStr = now.getFullYear() + "-" + pad(now.getMonth()+1) + "-" + pad(now.getDate());
  const targetHours = [6,9,12,15,18,21];
  let html = "";
  targetHours.forEach(h => {
    const key = todayStr + "T" + pad(h) + ":00";
    const idx = hourly.time.indexOf(key);
    const temp = idx >= 0 ? Math.round(hourly.temperature_2m[idx]) + "°" : "-";
    html += '<div class="hourly-item"><div class="hh">' + h + '時</div><div class="ht">' + temp + '</div></div>';
  });
  el.innerHTML = html;
}

async function updateWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current_weather=true&hourly=temperature_2m&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=6&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();
    const cw = data.current_weather;
    const info = weatherCodeMap[cw.weathercode] || ["-",""];
    document.getElementById("today-temp").textContent = Math.round(cw.temperature) + "℃";
    document.getElementById("today-wdesc").textContent = info[1] + " " + info[0];
    document.getElementById("today-weather-icon").textContent = info[1];
    latestDaily = data.daily || null;
    renderHourlyTrend(data.hourly || null);
    renderStrip();
  }catch(err){
    document.getElementById("today-wdesc").textContent = "天気を取得できませんでした";
  }
}
updateWeather();
setInterval(updateWeather, 30*60*1000);

// ---- 予定(Google Calendar API) ----
const dotColors = ["#e88fa3","#e8b34d","#7ab55c","#5fa8d9","#b48fd9"];
let latestFutureEvents = null; // Map dateString -> events[]

async function updateCalendar(){
  const todayListEl = document.getElementById("today-events-list");
  if(!GOOGLE_API_KEY){
    todayListEl.innerHTML = '<div class="cal-error">Google APIキーが未設定です。</div>';
    return;
  }
  try{
    const today = startOfDay(new Date());
    const timeMin = today.toISOString();
    const DAYS_AHEAD = 6;
    const rangeEnd = new Date(today); rangeEnd.setDate(rangeEnd.getDate()+DAYS_AHEAD);
    const url = "https://www.googleapis.com/calendar/v3/calendars/" +
      encodeURIComponent(CALENDAR_ID) + "/events?key=" + GOOGLE_API_KEY +
      "&timeMin=" + encodeURIComponent(timeMin) +
      "&timeMax=" + encodeURIComponent(rangeEnd.toISOString()) +
      "&singleEvents=true&orderBy=startTime&maxResults=30";
    const res = await fetch(url);
    if(!res.ok){
      todayListEl.innerHTML = '<div class="cal-error">予定を取得できませんでした(' + res.status + ')。</div>';
      return;
    }
    const data = await res.json();
    const events = data.items || [];

    const groups = new Map();
    for(let i=0; i<DAYS_AHEAD; i++){
      const d = new Date(today); d.setDate(d.getDate()+i);
      groups.set(d.toDateString(), { date:d, events:[] });
    }
    events.forEach(ev => {
      const isAllDay = !!ev.start.date;
      const startDate = isAllDay ? new Date(ev.start.date + "T00:00:00") : new Date(ev.start.dateTime);
      const key = startDate.toDateString();
      if(groups.has(key)){
        groups.get(key).events.push({
          title: ev.summary || "(タイトルなし)",
          time: isAllDay ? "終日" : pad(startDate.getHours()) + ":" + pad(startDate.getMinutes())
        });
      }
    });

    // 今日の予定
    const todayKey = today.toDateString();
    const todayEvents = groups.get(todayKey).events;
    let colorIdx = 0;
    if(todayEvents.length === 0){
      todayListEl.innerHTML = '<div class="cal-empty">予定なし</div>';
    }else{
      todayListEl.innerHTML = todayEvents.map(ev => {
        const color = dotColors[colorIdx++ % dotColors.length];
        return '<div class="cal-event"><span class="bullet" style="background:' + color + '"></span><span class="time">' + ev.time + '</span><span class="title">' + escapeHtml(ev.title) + '</span></div>';
      }).join("");
    }

    // 今後5日分をstrip用に保存
    latestFutureEvents = new Map();
    groups.forEach((group, key) => {
      if(key !== todayKey) latestFutureEvents.set(key, group.events);
    });
    renderStrip();
  }catch(err){
    todayListEl.innerHTML = '<div class="cal-error">予定の取得中にエラーが発生しました:<br>' + escapeHtml(err.message || String(err)) + '</div>';
  }
}
updateCalendar();
setInterval(updateCalendar, 15*60*1000);

// ---- 5日間ストリップ(天気+予定+ごみ) ----
function renderStrip(){
  const stripEl = document.getElementById("strip-row");
  const today = startOfDay(new Date());
  let html = "";
  for(let i=1; i<=5; i++){
    const d = new Date(today); d.setDate(d.getDate()+i);
    const dayLabel = (d.getMonth()+1) + "/" + d.getDate() + "(" + youbiList[d.getDay()] + ")";

    let weatherHtml = "-";
    if(latestDaily && latestDaily.weathercode && latestDaily.weathercode[i] !== undefined){
      const code = latestDaily.weathercode[i];
      const info = weatherCodeMap[code] || ["-",""];
      const max = Math.round(latestDaily.temperature_2m_max[i]);
      const min = Math.round(latestDaily.temperature_2m_min[i]);
      weatherHtml = '<span class="icon">' + info[1] + '</span><span class="fc-max">' + max + '°</span>/<span class="fc-min">' + min + '°</span>';
    }

    const gomi = gomiForDate(d);
    const gomiHtml = gomi
      ? ('<span class="icon">' + (gomiIconMap[gomi] || "🗑") + '</span>' + gomi)
      : ('<span class="icon">🚫</span>ごみ収集無し');

    let eventsHtml = '<span class="cal-empty" style="font-size:17px;">予定なし</span>';
    if(latestFutureEvents){
      const evs = latestFutureEvents.get(d.toDateString()) || [];
      if(evs.length){
        eventsHtml = evs.slice(0,2).map(e => escapeHtml((e.time !== "終日" ? e.time + " " : "") + e.title)).join("<br>");
        if(evs.length > 2) eventsHtml += "<br>…";
      }
    }

    html += '<div class="strip-day">' +
      '<div class="strip-daylabel">' + dayLabel + '</div>' +
      '<div class="strip-weather">' + weatherHtml + '</div>' +
      '<div class="strip-gomi">' + gomiHtml + '</div>' +
      '<div class="strip-events">' + eventsHtml + '</div>' +
    '</div>';
  }
  stripEl.innerHTML = html;
}

// ---- メモ/タスク(jsonbin.io) ----
const memoEl = document.getElementById("memo-text");
const statusEl = document.getElementById("memo-status");
let saveTimer = null;
let lastSavedValue = "";

async function loadMemo(){
  if(!JSONBIN_ID){ statusEl.textContent = "(端末内保存のみ)"; return; }
  statusEl.textContent = "読み込み中...";
  try{
    const res = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Master-Key": JSONBIN_KEY, "X-Bin-Meta": "false" }
    });
    if(!res.ok) throw new Error("status " + res.status);
    const data = await res.json();
    if(document.activeElement !== memoEl){
      memoEl.value = (data && data.content) || "";
      lastSavedValue = memoEl.value;
    }
    statusEl.textContent = "同期済み";
  }catch(err){
    statusEl.textContent = "同期エラー: " + (err.message || err);
  }
}

async function saveMemo(){
  const value = memoEl.value;
  if(value === lastSavedValue) return;
  if(!JSONBIN_ID){ statusEl.textContent = "(端末内保存のみ)"; return; }
  try{
    statusEl.textContent = "保存中...";
    const res = await fetch(JSONBIN_URL, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify({content: value})
    });
    if(!res.ok) throw new Error("status " + res.status);
    lastSavedValue = value;
    statusEl.textContent = "保存済み";
  }catch(err){
    statusEl.textContent = "保存エラー: " + (err.message || err);
  }
}

memoEl.addEventListener("input", () => {
  statusEl.textContent = "編集中...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveMemo, 2000);
});

loadMemo();
setInterval(loadMemo, 5*60*1000);
</script>
