<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おうちダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #e8d9bd;
    --paper: #fbf4e6;
    --paper-2: #fffaf0;
    --ink: #5b4636;
    --ink-dim: #9c8a72;
    --line: #e3d6bd;
    --accent-gomi: #6fa84f;   /* 黄緑: ごみの日 */
    --accent-cal: #4fa3c9;    /* 水色: カレンダー */
    --accent-weather: #e8a33d;/* 陽だまり色: 天気 */
    --accent-memo: #e0735c;  /* 珊瑚色: メモ */
    --accent-alert: #d64545;
    --tape-1: #cfe3c4;
    --tape-2: #f6c9d0;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      repeating-linear-gradient(3deg, rgba(70,42,16,0.12) 0px, rgba(70,42,16,0.12) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(3deg, rgba(120,80,40,0.10) 0px, rgba(120,80,40,0.10) 2px, transparent 2px, transparent 11px),
      repeating-linear-gradient(3deg, rgba(160,112,64,0.10) 0px, rgba(160,112,64,0.10) 6px, transparent 6px, transparent 38px),
      repeating-linear-gradient(3deg, rgba(90,58,26,0.08) 0px, rgba(90,58,26,0.08) 14px, transparent 14px, transparent 90px),
      linear-gradient(170deg, #ddbd8d 0%, #cda06d 45%, #b98a52 100%);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow: hidden;
  }
  .mincho{ font-family: 'Yomogi', cursive; font-weight: 400; }

  #app{
    display:grid;
    grid-template-rows: auto 1fr;
    height:100vh;
    width:100vw;
    padding: 28px;
    gap: 20px;
  }

  /* ---- header ---- */
  header{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:flex-end;
    padding-bottom: 4px;
  }
  #date-block{
    grid-column: 2;
    text-align:center;
  }
  #date-block .youbi{
    font-size: 26px;
    font-weight: 700;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    letter-spacing: 0.15em;
  }
  #date-block .date{
    font-size: clamp(28px, 4vw, 42px);
    margin-top: 4px;
  }
  #weather-block{
    grid-column: 3;
    justify-self: end;
    text-align:right;
    color: var(--accent-weather);
    background: var(--paper);
    border-radius: 16px;
    padding: 10px 22px;
    box-shadow: 0 3px 8px rgba(91,70,54,0.15);
  }
  #weather-block .temp{
    font-size: 36px;
    font-weight: 700;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-variant-numeric: tabular-nums;
  }
  #weather-block .desc{
    font-size: 16px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  /* ---- main grid ---- */
  #main{
    display:grid;
    grid-template-columns: minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.1fr);
    gap: 22px;
    min-height:0;
  }
  .col{ display:flex; flex-direction:column; gap:22px; min-height:0; }

  .panel{
    position: relative;
    background: var(--paper);
    border-radius: 14px;
    padding: 22px 26px;
    display:flex;
    flex-direction:column;
    min-height:0;
    box-shadow: 0 4px 12px rgba(91,70,54,0.18);
  }
  /* washiテープ風の飾り */
  .panel::before{
    content:"";
    position:absolute;
    top:-10px; left:50%;
    width:70px; height:22px;
    background: var(--tape-color, var(--tape-1));
    opacity:0.85;
    transform: translateX(-50%) rotate(-3deg);
    border-radius: 2px;
  }
  #cal-panel::before{ --tape-color: var(--tape-2); }
  #memo-panel::before{ --tape-color: #f6dfa6; }

  .panel h2{
    margin:0 0 14px 0;
    font-size: 19px;
    font-weight: 400;
    font-family: 'Yomogi', cursive;
    letter-spacing: 0.02em;
    color: var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* clock */
  #clock-panel{ flex: 0 0 auto; align-items:center; justify-content:center; container-type: inline-size; }
  #clock{
    font-size: clamp(28px, 17cqw, 96px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    white-space: nowrap;
  }
  #clock .sec{ font-size: 0.4em; color: var(--ink-dim); }

  /* gomi */
  .gomi-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 12px 0;
    border-bottom: 1px dashed var(--line);
  }
  .gomi-row:last-child{ border-bottom:none; }
  .gomi-row .label{ color: var(--ink-dim); font-size: 15px; }
  .gomi-row .item{ font-size: 22px; font-weight:700; color: var(--accent-gomi); }
  .gomi-row .item.none{ color: var(--ink-dim); font-weight:400; font-size:18px; }
  #gomi-note{ margin-top:10px; font-size:12px; color:var(--ink-dim); line-height:1.5; }

  /* forecast */
  #forecast-panel{ flex:1; }
  .forecast-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 15px;
  }
  .forecast-row:last-child{ border-bottom:none; }
  .fc-day{ color: var(--ink-dim); min-width: 64px; }
  .fc-icon{ font-size: 20px; }
  .fc-temp{ font-variant-numeric: tabular-nums; }
  .fc-max{ color: var(--accent-memo); font-weight:700; }
  .fc-min{ color: var(--accent-cal); }

  /* calendar */
  #cal-panel{ flex:1; }
  #cal-list{ flex:1; overflow-y:auto; min-height:0; }
  .cal-daygroup{ margin-bottom: 16px; }
  .cal-daygroup:last-child{ margin-bottom: 0; }
  .cal-daylabel{
    font-size: 14px;
    color: var(--accent-cal);
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
    border-bottom: 1px dashed var(--line);
    padding-bottom: 4px;
  }
  .cal-event{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 6px 0;
    font-size: 16px;
    line-height: 1.5;
  }
  .cal-event .bullet{
    width:10px; height:10px; border-radius:50%;
    flex: 0 0 auto;
  }
  .cal-event .time{
    flex: 0 0 auto;
    min-width: 70px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .cal-event .title{ flex:1; }
  .cal-empty{ color: var(--ink-dim); font-size: 15px; padding: 4px 0; }
  .cal-error{ color: var(--accent-alert); font-size: 14px; }

  /* memo */
  #memo-panel{ flex:1; }
  #memo-status{ font-size:12px; color: var(--ink-dim); margin-left:auto; font-family: 'Zen Kaku Gothic New', sans-serif; }
  #memo-text{
    flex:1;
    resize:none;
    background: var(--paper-2);
    border: 1px dashed var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 18px;
    line-height: 1.9;
    padding: 14px;
    outline:none;
    background-image: repeating-linear-gradient(transparent, transparent 33px, var(--line) 34px);
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div id="date-block">
      <div class="youbi">☁️ <span id="youbi">-</span></div>
      <div class="date mincho" id="date">----年--月--日</div>
    </div>
    <div id="weather-block">
      <div class="temp" id="temp">--℃</div>
      <div class="desc" id="wdesc">読み込み中...</div>
    </div>
  </header>

  <div id="main">
    <div class="col">
      <div class="panel" id="clock-panel">
        <div id="clock">--:--<span class="sec">--</span></div>
      </div>
      <div class="panel" id="gomi-panel">
        <h2>🗑️ ごみの日</h2>
        <div class="gomi-row">
          <span class="label">今日</span>
          <span class="item" id="gomi-today">-</span>
        </div>
        <div class="gomi-row">
          <span class="label">明日</span>
          <span class="item" id="gomi-tomorrow">-</span>
        </div>
        <div id="gomi-note">※基本パターンの自動計算です。祝日等の変更は「さんあ〜る」アプリで必ずご確認ください。</div>
      </div>
      <div class="panel" id="forecast-panel">
        <h2>🌤️ 5日間の予報</h2>
        <div id="forecast-list"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="cal-panel">
        <h2>🗓️ 予定</h2>
        <div id="cal-list"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel" id="memo-panel">
        <h2>✏️ メモ・タスク<span id="memo-status"></span></h2>
        <textarea id="memo-text" placeholder="ここにメモやタスクを書いてください。スマホからも編集できます。"></textarea>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   設定エリア(必要に応じて書き換えてください)
   ========================================================= */
// 天気の地点:宝塚市
const WEATHER_LAT = 34.80;
const WEATHER_LON = 135.36;

// メモ/タスクの保存先(Google Apps Script の Web アプリ URL)
// まだ準備できていない場合は空のままで構いません(メモ欄はこの端末だけで一時的に動作します)
const MEMO_API_URL = "https://script.google.com/macros/s/AKfycbzkBhUtK3zD1X_ZX2mJXYEIz7s9WYnGVf9X2oC5Hn4MCbz-kWLZsWx_VRV-pZ8FDp4n7A/exec";

// Googleカレンダー(公開設定済みのカレンダーID と APIキー)
const CALENDAR_ID = "bellyrie@gmail.com";
const GOOGLE_API_KEY = "AIzaSyCnFw7dx-Dm8q6E5_Dudp7jssSLhGbIyiQ";

// ごみ収集の基準日(このアプリのカレンダーで確認した実際の日付とズレたら調整してください)
const GOMI_WED_REF = new Date(2026, 3, 1);  // 2026-04-01(水)= ペットボトルの週
const GOMI_FRI_REF = new Date(2026, 3, 3);  // 2026-04-03(金)= 紙・布の週

/* ========================================================= */

// ---- 日付・時計 ----
const youbiList = ["日","月","火","水","木","金","土"];
function pad(n){ return String(n).padStart(2,"0"); }

function updateClock(){
  const now = new Date();
  document.getElementById("clock").innerHTML =
    pad(now.getHours()) + ":" + pad(now.getMinutes()) +
    '<span class="sec">' + pad(now.getSeconds()) + "</span>";
  document.getElementById("date").textContent =
    now.getFullYear() + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
  document.getElementById("youbi").textContent = youbiList[now.getDay()] + "曜日";
}
setInterval(updateClock, 1000);
updateClock();

// ---- 天気(Open-Meteo, APIキー不要) ----
const weatherCodeMap = {
  0:["快晴","☀️"],1:["晴れ","🌤️"],2:["晴れ時々曇り","⛅"],3:["曇り","☁️"],
  45:["霧","🌫️"],48:["霧","🌫️"],
  51:["小雨","🌦️"],53:["小雨","🌦️"],55:["雨","🌧️"],
  61:["雨","🌧️"],63:["雨","🌧️"],65:["大雨","🌧️"],
  71:["雪","🌨️"],73:["雪","🌨️"],75:["大雪","❄️"],
  80:["にわか雨","🌦️"],81:["にわか雨","🌦️"],82:["激しい雨","⛈️"],
  95:["雷雨","⛈️"],96:["雷雨","⛈️"],99:["雷雨","⛈️"]
};

async function updateWeather(){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=6&timezone=Asia%2FTokyo`;
    const res = await fetch(url);
    const data = await res.json();
    const cw = data.current_weather;
    const info = weatherCodeMap[cw.weathercode] || ["-",""];
    document.getElementById("temp").textContent = Math.round(cw.temperature) + "℃";
    document.getElementById("wdesc").textContent = info[1] + " " + info[0];

    // 5日間予報(今日を除く翌日から5日分)
    const forecastEl = document.getElementById("forecast-list");
    if(forecastEl && data.daily){
      const days = data.daily.time;
      let html = "";
      for(let i=1; i<days.length && i<=5; i++){
        const d = new Date(days[i] + "T00:00:00");
        const code = data.daily.weathercode[i];
        const info2 = weatherCodeMap[code] || ["-",""];
        const max = Math.round(data.daily.temperature_2m_max[i]);
        const min = Math.round(data.daily.temperature_2m_min[i]);
        html += '<div class="forecast-row">' +
          '<span class="fc-day">' + (d.getMonth()+1) + '/' + d.getDate() + '(' + youbiList[d.getDay()] + ')</span>' +
          '<span class="fc-icon">' + info2[1] + '</span>' +
          '<span class="fc-temp"><span class="fc-max">' + max + '°</span>/<span class="fc-min">' + min + '°</span></span>' +
        '</div>';
      }
      forecastEl.innerHTML = html;
    }
  }catch(err){
    document.getElementById("wdesc").textContent = "天気を取得できませんでした";
  }
}
updateWeather();
setInterval(updateWeather, 30*60*1000); // 30分ごと

// ---- ごみの日 ----
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function weeksBetween(a,b){ return Math.floor((startOfDay(a)-startOfDay(b))/(7*86400000)); }

function gomiForDate(date){
  const wd = date.getDay(); // 0=日
  if(wd===1) return "燃やすごみ";
  if(wd===2) return "プラスチック類";
  if(wd===4) return "燃やすごみ";
  if(wd===3){
    const w = ((weeksBetween(date, GOMI_WED_REF) % 2) + 2) % 2;
    return w===0 ? "ペットボトル" : "かん・びん";
  }
  if(wd===5){
    const w = ((weeksBetween(date, GOMI_FRI_REF) % 2) + 2) % 2;
    return w===0 ? "紙・布" : "小型不燃ごみ";
  }
  return null; // 土・日は収集なし
}

function updateGomi(){
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  const t = gomiForDate(today);
  const tm = gomiForDate(tomorrow);
  const elT = document.getElementById("gomi-today");
  const elM = document.getElementById("gomi-tomorrow");
  elT.textContent = t || "収集なし";
  elT.className = "item" + (t? "" : " none");
  elM.textContent = tm || "収集なし";
  elM.className = "item" + (tm? "" : " none");
}
updateGomi();
setInterval(updateGomi, 60*60*1000); // 1時間ごと

// ---- 予定(Google Calendar API) ----
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtDayLabel(date, today){
  const diff = Math.round((startOfDay(date) - startOfDay(today)) / 86400000);
  if(diff === 0) return "今日";
  if(diff === 1) return "明日";
  return (date.getMonth()+1) + "/" + date.getDate() + "(" + youbiList[date.getDay()] + ")";
}

const dotColors = ["#e88fa3","#e8b34d","#7ab55c","#5fa8d9","#b48fd9"];

async function updateCalendar(){
  const listEl = document.getElementById("cal-list");
  if(!GOOGLE_API_KEY){
    listEl.innerHTML = '<div class="cal-error">Google APIキーが未設定です。</div>';
    return;
  }
  try{
    const today = startOfDay(new Date());
    const timeMin = today.toISOString();
    const rangeEnd = new Date(today); rangeEnd.setDate(rangeEnd.getDate()+8);
    const url = "https://www.googleapis.com/calendar/v3/calendars/" +
      encodeURIComponent(CALENDAR_ID) + "/events?key=" + GOOGLE_API_KEY +
      "&timeMin=" + encodeURIComponent(timeMin) +
      "&timeMax=" + encodeURIComponent(rangeEnd.toISOString()) +
      "&singleEvents=true&orderBy=startTime&maxResults=30";
    const res = await fetch(url);
    if(!res.ok){
      listEl.innerHTML = '<div class="cal-error">予定を取得できませんでした(' + res.status + ')。カレンダーの公開設定・APIキーをご確認ください。</div>';
      return;
    }
    const data = await res.json();
    const events = data.items || [];

    // 日付ごとにグループ化
    const groups = new Map();
    for(let i=0;i<8;i++){
      const d = new Date(today); d.setDate(d.getDate()+i);
      groups.set(d.toDateString(), { date:d, events:[] });
    }
    events.forEach(ev => {
      const isAllDay = !!ev.start.date;
      const startDate = isAllDay ? new Date(ev.start.date + "T00:00:00") : new Date(ev.start.dateTime);
      const key = startDate.toDateString();
      if(groups.has(key)){
        groups.get(key).events.push({
          title: ev.summary || "(タイトルなし)",
          time: isAllDay ? "終日" : pad(startDate.getHours()) + ":" + pad(startDate.getMinutes())
        });
      }
    });

    let html = "";
    let colorIdx = 0;
    groups.forEach(group => {
      html += '<div class="cal-daygroup"><div class="cal-daylabel">' + fmtDayLabel(group.date, today) + '</div>';
      if(group.events.length === 0){
        html += '<div class="cal-empty">予定なし</div>';
      }else{
        group.events.forEach(ev => {
          const color = dotColors[colorIdx % dotColors.length];
          colorIdx++;
          html += '<div class="cal-event"><span class="bullet" style="background:' + color + '"></span><span class="time">' + ev.time + '</span><span class="title">' + escapeHtml(ev.title) + '</span></div>';
        });
      }
      html += '</div>';
    });
    listEl.innerHTML = html;
  }catch(err){
    listEl.innerHTML = '<div class="cal-error">予定の取得中にエラーが発生しました:<br>' + escapeHtml(err.message || String(err)) + '</div>';
  }
}
updateCalendar();
setInterval(updateCalendar, 15*60*1000); // 15分ごと

// ---- メモ/タスク ----
const memoEl = document.getElementById("memo-text");
const statusEl = document.getElementById("memo-status");
let saveTimer = null;
let lastSavedValue = "";

async function loadMemo(){
  if(!MEMO_API_URL){ statusEl.textContent = "(端末内保存のみ)"; return; }
  statusEl.textContent = "読み込み中...";
  const callbackName = "__memoCb_" + Date.now();
  return new Promise((resolve) => {
    let done = false;
    const timeout = setTimeout(() => {
      if(!done){
        done = true;
        statusEl.textContent = "同期エラー: タイムアウト";
        cleanup();
        resolve();
      }
    }, 10000);

    function cleanup(){
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data){
      if(done) return;
      done = true;
      clearTimeout(timeout);
      if(document.activeElement !== memoEl){
        memoEl.value = (data && data.content) || "";
        lastSavedValue = memoEl.value;
      }
      statusEl.textContent = "同期済み";
      cleanup();
      resolve();
    };

    const script = document.createElement("script");
    script.src = MEMO_API_URL + "?callback=" + callbackName + "&_t=" + Date.now();
    script.onerror = () => {
      if(done) return;
      done = true;
      clearTimeout(timeout);
      statusEl.textContent = "同期エラー: 読み込み失敗";
      cleanup();
      resolve();
    };
    document.body.appendChild(script);
  });
}

async function saveMemo(){
  const value = memoEl.value;
  if(value === lastSavedValue) return;
  if(!MEMO_API_URL){ statusEl.textContent = "(端末内保存のみ)"; return; }
  try{
    statusEl.textContent = "保存中...";
    // Apps ScriptのCORS制限を避けるため no-cors で送信(応答内容は確認できないが送信自体は成功する)
    await fetch(MEMO_API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({content: value})
    });
    lastSavedValue = value;
    statusEl.textContent = "保存済み";
  }catch(err){
    statusEl.textContent = "保存エラー: " + (err.message || err);
  }
}

memoEl.addEventListener("input", () => {
  statusEl.textContent = "編集中...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveMemo, 2000); // 入力停止2秒後に自動保存
});

loadMemo();
setInterval(loadMemo, 5*60*1000); // 5分ごとに他端末の更新を取り込み

</script>
</body>
</html>
