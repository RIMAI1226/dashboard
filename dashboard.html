function doGet(e) {
  var sheet = getMemoSheet_();
  var content = sheet.getRange("A1").getValue() || "";
  var payload = JSON.stringify({content: content});

  if (e.parameter.postmsg) {
    var html = "<script>parent.postMessage(" + payload + ", '*');<\/script>";
    return HtmlService.createHtmlOutput(html)
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  }
  if (e.parameter.callback) {
    return ContentService.createTextOutput(e.parameter.callback + "(" + payload + ")")
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(payload)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var sheet = getMemoSheet_();
  var data = JSON.parse(e.postData.contents);
  sheet.getRange("A1").setValue(data.content);
  return ContentService.createTextOutput(JSON.stringify({status: "ok"}))
    .setMimeType(ContentService.MimeType.JSON);
}

function getMemoSheet_() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName("Memo");
  if (!sheet) {
    sheet = ss.insertSheet("Memo");
    sheet.getRange("A1").setValue("");
  }
  return sheet;
}
